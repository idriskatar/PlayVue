name: playvue
description: PlayVue - M3U / IPTV oynatıcı (Multiview + Kayıt)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.5
  provider: ^6.1.2
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  file_picker: ^8.1.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Simge: assets/icon/icon.png dosyasını (1024x1024 PNG) kendi simgenle değiştir.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
