name: iOS IPA (imzasız)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform klasörlerini üret ve yamala
        run: tools/bootstrap.sh ios

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Uygulama simgesini üret
        run: dart run flutter_launcher_icons

      - name: iOS derle (imzasız)
        run: flutter build ios --release --no-codesign

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr PlayVue-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PlayVue-ios-unsigned
          path: PlayVue-unsigned.ipa

      - name: GitHub Release (tag ile)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PlayVue-unsigned.ipa
