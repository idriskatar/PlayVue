name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform klasörlerini üret ve yamala
        run: bash tools/bootstrap.sh android

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Uygulama simgesini üret
        run: dart run flutter_launcher_icons

      - name: APK derle (release)
        run: flutter build apk --release --split-per-abi

      - name: APK imzala (keystore tanımlıysa)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd build/app/outputs/flutter-apk
          mkdir -p signed
          for f in app-*-release.apk; do
            "$BT/zipalign" -p -f 4 "$f" "aligned-$f"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:K_PASS \
              --out "signed/PlayVue-${f#app-}" "aligned-$f"
          done

      - name: İmzasız (debug anahtarlı) APK'ları adlandır
        if: env.KEYSTORE_BASE64 == ''
        run: |
          cd build/app/outputs/flutter-apk
          mkdir -p signed
          for f in app-*-release.apk; do cp "$f" "signed/PlayVue-${f#app-}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: PlayVue-android
          path: build/app/outputs/flutter-apk/signed/*.apk

      - name: GitHub Release (tag ile)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/signed/*.apk
